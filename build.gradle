plugins {
//    id 'com.github.spotbugs' version '6.4.8'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

apply plugin: 'io.github.gradle-nexus.publish-plugin'

// We require building with JDK 25 or later. Built artifact compatibility
// is controlled by javaLanguageVersion
assert JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)

group = 'com.fifesoft'
// NOTE: Local Java 25: /Library/Java/JavaVirtualMachines/jdk-25.0.1+8/Contents/Home

allprojects {

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }

    wrapper {
        gradleVersion = '9.8.1'
    }

	tasks.withType(Javadoc) {
		options.addStringOption('Xdoclint:none', '-quiet')
	}
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'checkstyle'
//    apply plugin: 'com.github.spotbugs'

    test {
        useJUnitPlatform()
    }

    checkstyle {
        toolVersion = '14.3.0'
        configDirectory = file("$rootProject.projectDir/config/checkstyle")
    }

//    spotbugsMain {
//        reports {
//            html {
//                required = true
//            }
//            xml {
//                required = false
//            }
//        }
//    }
//    spotbugsTest {
//        reports {
//            html {
//                required = true
//            }
//            xml {
//                required = false
//            }
//        }
//    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.mockito:mockito-core:5.24.0'
    }

    compileJava {
        options.release = Integer.parseInt(javaLanguageVersion)
        options.debug = true
        options.debugOptions.debugLevel = 'source,vars,lines'
        options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            // We must defensively check for these properties so CI builds work
            username.set(project.hasProperty('sonatypeUsername') ? sonatypeUsername : 'unknown')
            password.set(project.hasProperty('sonatypePassword') ? sonatypePassword : 'unknown')
        }
    }
}
